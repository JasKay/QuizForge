name: Expand community question bank
on:
  push:
    branches: [data/expand-2200-questions]
    paths:
      - .github/workflows/expand-question-bank.yml
  pull_request:\n    branches: [main]\n    paths:\n      - .github/workflows/expand-question-bank.yml\n  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/expand-2200-questions
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch community questions (CC BY-SA 4.0)
        run: node --experimental-strip-types scripts/expand-bank.ts 55 2200
      - name: Audit imported questions
        run: |
          npm ci
          npm run bank:audit
      - name: Commit data and audit (not production-approved)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/community-questions.json question-bank-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "data: collect and audit community questions [skip ci]"
            git push
          fi
