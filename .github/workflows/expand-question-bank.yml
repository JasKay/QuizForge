name: Expand community question bank
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Fetch community questions (CC BY-SA 4.0)
        run: npm run bank:expand -- 55 2200
      - name: Audit imported questions
        run: npm run bank:audit
      - name: Commit data and audit (not production-approved)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/community-questions.json question-bank-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "data: collect and audit community questions [skip ci]"
            git push origin HEAD:main
          fi
